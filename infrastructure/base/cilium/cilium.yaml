apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 10m0s
  chart: 
    spec: 
      chart: cilium
      version: 1.20.2
    sourceRef:
      name: cilium
      kind: HelmRepository
    interval: 10m0s
  targetNamespace: kube-system
  storageNamespace: kube-system
  values:
    ipam:
      mode: "kubernetes"
    image:
      pullPolicy: "IfNotPresent"

