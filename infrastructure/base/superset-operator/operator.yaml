apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: superset-operator
  namespace: superset-operator
spec:
  chart:
    spec:
      chart: superset-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        name: superset-operator
        kind: HelmRepository
  interval: 1m0s
  watch:
    namespaces:
      - superset-operator
      - superset