apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: superset-operator
  namespace: superset-operator
spec:
  chart:
    spec:
      chart: superset-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        name: superset-operator
        kind: HelmRepository
        namespace: flux-system
  interval: 1m0s
  values:
    watch:
      namespaces:
        - superset-operator
        - superset